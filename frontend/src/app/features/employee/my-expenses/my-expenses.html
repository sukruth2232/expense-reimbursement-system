<app-page-header title="My expenses" subtitle="Every claim you have created">
  <a mat-flat-button routerLink="/employee/expenses/new"><mat-icon>add</mat-icon>New expense</a>
</app-page-header>

<mat-button-toggle-group class="filter-bar" [value]="status()" (change)="setStatus($event.value)"
                         aria-label="Filter by status">
  @for (f of filters; track f.label) {
    <mat-button-toggle [value]="f.value">{{ f.label }}</mat-button-toggle>
  }
</mat-button-toggle-group>

<mat-card appearance="outlined">
  @if (loading()) {
    <mat-progress-bar mode="indeterminate" />
  }

  @if (rows().length > 0) {
    <app-expense-table [rows]="rows()" (rowClick)="open($event)" />
    <mat-paginator [length]="total()" [pageIndex]="page() - 1" [pageSize]="pageSize()"
                   [pageSizeOptions]="[5, 10, 25]" (page)="onPage($event)" />
  } @else if (!loading()) {
    <app-empty-state icon="receipt_long" title="No expenses found"
                     [message]="status() ? 'Nothing with this status.' : 'Create your first expense claim.'" />
  }
</mat-card>
